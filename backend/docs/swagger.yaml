    - preference_key
    - preference_value
    type: object
  handler.ssiListItemResponse:
    properties:
      account_name:
        type: string
      bic:
        type: string
      counterparty_name:
        type: string
      country_code:
        type: string
      currency:
        type: string
      iban:
        type: string
      id:
        type: string
      settlement_method:
        type: string
      ssi_reference:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handler.submitTranslationRequest:
    properties:
      language_code:
        type: string
      notes:
        type: string
      translation_key:
        type: string
      translation_value:
        type: string
    required:
    - language_code
    - translation_key
    - translation_value
    type: object
  handler.succeedProvisionalLEIRequest:
    properties:
      official_lei:
        type: string
