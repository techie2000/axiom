basePath: /api/v1
definitions:
  domain.Account:
    properties:
      account_currency:
        $ref: '#/definitions/domain.Currency'
      account_currency_id:
        type: string
      account_number:
        type: string
      active:
        type: boolean
      balance:
        type: number
      created_at:
        type: string
      entity:
        $ref: '#/definitions/domain.Entity'
      entity_id:
        type: string
      id:
        type: string
      opened_at:
        type: string
      type:
        $ref: '#/definitions/domain.AccountType'
      updated_at:
        type: string
    required:
    - account_number
    type: object
  domain.AccountType:
    enum:
    - TRADING
    - SETTLEMENT
    - CUSTODY
    - MARGIN
    type: string
    x-enum-varnames:
    - AccountTypeTrading
    - AccountTypeSettlement
    - AccountTypeCustody
    - AccountTypeMargin
  domain.Address:
    properties:
      address_line_1:
        description: Unstructured address lines (ISO20022 allows up to 7 lines)
        type: string
      address_line_2:
        type: string
      address_line_3:
        type: string
      address_line_4:
        type: string
      address_line_5:
        type: string
      address_line_6:
        type: string
      address_line_7:
        type: string
      address_type:
        description: Structured address fields (ISO20022)
        type: string
      building_name:
        description: Building name
        type: string
      building_number:
        description: Building number
        type: string
      country:
        $ref: '#/definitions/domain.Country'
      country_id:
        type: string
      country_sub_division:
        description: State/province/region
        type: string
      created_at:
        type: string
      department:
        description: Department
        type: string
      district_name:
        description: District name
        type: string
      floor:
        description: Floor
        type: string
      id:
        type: string
      post_box:
        description: Post office box number
        type: string
      postal_code:
        description: Postal code/ZIP code
        type: string
      room:
        description: Room
        type: string
      street_name:
        description: Street name
        type: string
      sub_department:
        description: Sub-department
        type: string
      town_location_name:
        description: Town location name
        type: string
      town_name:
        description: Town/city name
        type: string
      updated_at:
        type: string
    type: object
  domain.ChildrenScope:
    enum:
    - none
    - direct
    - all
    type: string
    x-enum-comments:
      ChildrenScopeAll: Access extends to the entity and all descendants.
      ChildrenScopeDirect: Access extends to the entity and its direct children.
      ChildrenScopeNone: Access limited to the named entity only.
    x-enum-descriptions:
    - Access limited to the named entity only.
    - Access extends to the entity and its direct children.
    - Access extends to the entity and all descendants.
    x-enum-varnames:
    - ChildrenScopeNone
    - ChildrenScopeDirect
    - ChildrenScopeAll
  domain.CodeMapping:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      from_code:
        type: string
      from_code_type:
        type: string
      from_system:
        type: string
      id:
        type: string
      to_code:
        type: string
      to_code_type:
        type: string
      to_system:
        type: string
      updated_at:
        type: string
    required:
    - from_code
    - from_code_type
    - from_system
    - to_code
    - to_code_type
    - to_system
    type: object
  domain.CodeType:
    enum:
    - ISIN
    - FIGI
    - CUSIP
    - WKN
    - SEDOL
    - RIC
    - TICKER
    - BLOOMBERG
    type: string
    x-enum-varnames:
    - CodeTypeISIN
    - CodeTypeFIGI
    - CodeTypeCUSIP
    - CodeTypeWKN
    - CodeTypeSEDOL
    - CodeTypeRIC
    - CodeTypeTicker
    - CodeTypeBloomberg
  domain.Country:
    properties:
      active:
        type: boolean
      alpha3_code:
        type: string
      capital:
        type: string
      code:
        type: string
      continent:
        description: AF, AN, AS, EU, NA, OC, SA
        type: string
      created_at:
        type: string
      currency_codes:
        description: JSON array of currency codes
        type: string
      id:
        type: string
      languages:
        description: JSON array of language codes
        type: string
      name:
        type: string
      native_name:
        type: string
      phone_codes:
        description: JSON array of phone codes
        type: string
      region:
        type: string
      updated_at:
        type: string
    required:
    - code
    - name
    type: object
  domain.Currency:
    properties:
      active:
        type: boolean
      code:
        type: string
      created_at:
        type: string
      decimal_digits:
        type: integer
      id:
        type: string
      is_alert_cls_allowed:
        type: boolean
      is_ofac_sanctioned:
        type: boolean
      name:
        type: string
      name_plural:
        type: string
      rounding:
        type: integer
      symbol:
        type: string
      symbol_native:
        type: string
      updated_at:
        type: string
    required:
    - code
    - name
    type: object
  domain.Entity:
    properties:
      active:
        type: boolean
      addresses:
        items:
          $ref: '#/definitions/domain.EntityAddress'
        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      registration_number:
        type: string
      type:
        $ref: '#/definitions/domain.EntityType'
      updated_at:
        type: string
    required:
    - name
    type: object
  domain.EntityAddress:
    properties:
      address:
        $ref: '#/definitions/domain.Address'
      address_id:
        type: string
      address_type:
        description: e.g., 'REGISTERED', 'TRADING', 'BILLING', 'CORRESPONDENCE'
        type: string
      created_at:
        type: string
      entity:
        $ref: '#/definitions/domain.Entity'
      entity_id:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      updated_at:
        type: string
    type: object
  domain.EntityRole:
    enum:
    - viewer
    - trader
    - entity_admin
    type: string
    x-enum-comments:
      EntityRoleEntityAdmin: Can manage other users' links to this entity.
      EntityRoleTrader: Read + trade instruction access.
      EntityRoleViewer: Read-only access to this entity's data.
    x-enum-descriptions:
    - Read-only access to this entity's data.
    - Read + trade instruction access.
    - Can manage other users' links to this entity.
    x-enum-varnames:
    - EntityRoleViewer
    - EntityRoleTrader
    - EntityRoleEntityAdmin
  domain.EntityType:
    enum:
    - COMPANY
    - BUSINESS
    - CORPORATION
    - PARTNERSHIP
    - INDIVIDUAL
    type: string
    x-enum-varnames:
    - EntityTypeCompany
    - EntityTypeBusiness
    - EntityTypeCorporation
    - EntityTypePartnership
    - EntityTypeIndividual
  domain.FileProcessingStatus:
    properties:
      created_at:
        type: string
      current_source_file:
        $ref: '#/definitions/domain.SourceFile'
      current_source_file_id:
        type: string
      depends_on_job_label:
        type: string
      depends_on_job_type:
        description: |-
          DependsOnJobType is the JobType of the upstream job that must complete successfully
          before this job can run.  Empty string means this is a root job with no dependency.
          Known chain: DAILY_FULL → LEVEL2_RR → LEVEL2_REPEX.
        type: string
      error_message:
        type: string
      id:
        type: string
      job_label:
        type: string
      job_type:
        description: DAILY_FULL, DAILY_DELTA, LEVEL2_RR, LEVEL2_REPEX
        type: string
      last_run_at:
        type: string
      last_success_at:
        type: string
      next_run_at:
        type: string
      progress_message:
        type: string
      status:
        description: IDLE, RUNNING, COMPLETED, FAILED
        type: string
      updated_at:
        type: string
    type: object
  domain.IdentifierLevel:
    enum:
    - INTERNATIONAL
    - REGIONAL
    - LOCAL
    type: string
    x-enum-comments:
      IdentifierLevelInternational: ISIN, FIGI
      IdentifierLevelLocal: Exchange-specific codes
      IdentifierLevelRegional: CUSIP, WKN
    x-enum-descriptions:
    - ISIN, FIGI
    - CUSIP, WKN
    - Exchange-specific codes
    x-enum-varnames:
    - IdentifierLevelInternational
    - IdentifierLevelRegional
    - IdentifierLevelLocal
  domain.Instrument:
    properties:
      active:
        type: boolean
      codes:
        items:
          $ref: '#/definitions/domain.InstrumentCode'
        type: array
      created_at:
        type: string
      id:
        type: string
      issue_currency:
        $ref: '#/definitions/domain.Currency'
      issue_currency_id:
        type: string
      name:
        type: string
      primary_exchange:
        type: string
      type:
        $ref: '#/definitions/domain.InstrumentType'
      updated_at:
        type: string
    required:
    - name
    type: object
  domain.InstrumentCode:
    properties:
      code_type:
        $ref: '#/definitions/domain.CodeType'
      code_value:
        type: string
      created_at:
        type: string
      id:
        type: string
      identifier_level:
        $ref: '#/definitions/domain.IdentifierLevel'
      instrument:
        $ref: '#/definitions/domain.Instrument'
      instrument_id:
        type: string
      market_identifier_code:
        description: MIC code (e.g., XNAS, XFRA)
        type: string
      region:
        description: For regional codes (e.g., US, DE)
        type: string
      updated_at:
        type: string
    type: object
  domain.InstrumentType:
    enum:
    - EQUITY
    - BOND
    - DERIVATIVE
    - COMMODITY
    - FUND
    - FOREX
    type: string
    x-enum-varnames:
    - InstrumentTypeEquity
    - InstrumentTypeBond
    - InstrumentTypeDerivative
    - InstrumentTypeCommodity
    - InstrumentTypeFund
    - InstrumentTypeForex
  domain.LEIRecord:
    properties:
      changed_fields:
        description: Last change details
        type: string
      child_lei:
        type: string
      created_at:
        description: Standard fields
        type: string
      created_by:
        type: string
      entity_category:
        type: string
      entity_legal_form:
        type: string
      entity_legal_form_name:
        type: string
      entity_status:
        type: string
      entity_sub_category:
        type: string
      hq_address_city:
        type: string
      hq_address_country:
        description: ISO 3166-1 alpha-2
        type: string
      hq_address_line_1:
        description: Headquarters address
        type: string
      hq_address_line_2:
        type: string
      hq_address_line_3:
        type: string
      hq_address_line_4:
        type: string
      hq_address_postal_code:
        type: string
      hq_address_region:
        type: string
      id:
        type: string
      initial_registration_date:
        description: Dates
        type: string
      is_provisional:
        description: |-
          Provisional LEI fields (migration 000062)
          IsProvisional is TRUE for Axiom-issued provisional LEI records (AXIO prefix).
          FALSE for all GLEIF-ingested records. Defaults to FALSE.
        type: boolean
      last_update_date:
        type: string
      legal_address_city:
        type: string
      legal_address_country:
        description: ISO 3166-1 alpha-2
        type: string
      legal_address_line_1:
        description: Legal address
        type: string
      legal_address_line_2:
        type: string
      legal_address_line_3:
        type: string
      legal_address_line_4:
        type: string
      legal_address_postal_code:
        type: string
      legal_address_region:
        type: string
      legal_jurisdiction:
        type: string
      legal_name:
        description: Entity information
        type: string
      lei:
        description: Legal Entity Identifier (unique)
        type: string
      managing_lou:
        description: Associated entities
        type: string
      managing_lou_legal_name:
        type: string
      next_renewal_date:
        type: string
      other_names:
        description: Array of alternative names
        type: string
      parent_lei:
        description: |-
          Relationship data hydrated from lei_relationship_records for provisional LEIs.
          Not stored in lei_records; populated by the provisional LEI service layer only.
        type: string
      provisioning_source:
        type: string
      registration_authority:
        description: Registration
        type: string
      registration_authority_comments:
        type: string
      registration_authority_id:
        type: string
      registration_authority_international_name:
        type: string
      registration_authority_name:
        description: GLEIF reference resolved names (computed via JOIN, not stored
          in lei_records)
        type: string
      registration_authority_website:
        type: string
      registration_number:
        type: string
      registration_status:
        type: string
      source_file:
        $ref: '#/definitions/domain.SourceFile'
      source_file_id:
        description: Audit and provenance
        type: string
      successor_lei:
        type: string
      successor_lei_legal_name:
        type: string
      transliterated_legal_name:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      validation_authority:
        type: string
      validation_sources:
        description: Validation
        type: string
    required:
    - lei
    type: object
  domain.LEIRecordAudit:
    properties:
      action:
        description: CREATE, UPDATE, DELETE
        type: string
      changed_by:
        type: string
      changed_fields:
        description: Change details
        type: string
      created_at:
        type: string
      id:
        type: string
      lei:
        type: string
      lei_record_id:
        type: string
      record_snapshot:
        description: Complete record snapshot
        type: string
      source_file_id:
        description: Source information
        type: string
    type: object
  domain.Language:
    properties:
      code:
        type: string
      created_at:
        type: string
      name:
        type: string
      native:
        type: string
      rtl:
        type: boolean
      updated_at:
        type: string
    type: object
  domain.SSI:
    properties:
      active:
        type: boolean
      beneficiary_account:
        type: string
      beneficiary_bank:
        type: string
      beneficiary_bank_bic:
        type: string
      beneficiary_name:
        type: string
      created_at:
        type: string
      entity:
        $ref: '#/definitions/domain.Entity'
      entity_id:
        type: string
      id:
        type: string
      instrument:
        $ref: '#/definitions/domain.Instrument'
      instrument_id:
        type: string
      intermediary_bank:
        type: string
      intermediary_bank_bic:
        type: string
      settlement_currency:
        $ref: '#/definitions/domain.Currency'
      settlement_currency_id:
        type: string
      settlement_type:
        $ref: '#/definitions/domain.SettlementType'
      updated_at:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    required:
    - beneficiary_account
    - beneficiary_bank
    - beneficiary_name
    type: object
  domain.SettlementType:
    enum:
    - DVP
    - FOP
    - RVP
    - DAP
    type: string
    x-enum-comments:
      SettlementTypeDAP: Delivery Against Payment
      SettlementTypeDVP: Delivery Versus Payment
      SettlementTypeFOP: Free Of Payment
      SettlementTypeRVP: Receive Versus Payment
    x-enum-descriptions:
    - Delivery Versus Payment
    - Free Of Payment
    - Receive Versus Payment
    - Delivery Against Payment
    x-enum-varnames:
    - SettlementTypeDVP
    - SettlementTypeFOP
    - SettlementTypeRVP
    - SettlementTypeDAP
  domain.SourceFile:
    properties:
      created_at:
        type: string
      downloaded_at:
        type: string
      failed_records:
        type: integer
      failure_category:
        description: SCHEMA_ERROR, NETWORK_ERROR, FILE_CORRUPTION, UNKNOWN
        type: string
      file_hash:
        description: SHA-256 hash
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      file_type:
        description: FULL, DELTA
        type: string
      file_url:
        type: string
      id:
        type: string
      job_label:
        type: string
      job_type:
        type: string
      last_processed_lei:
        description: For resumption
        type: string
      max_retries:
        type: integer
      processed_records:
        type: integer
      processing_completed_at:
        type: string
      processing_error:
        type: string
      processing_started_at:
        type: string
      processing_status:
        description: Processing status
        type: string
      publication_date:
        type: string
      retry_count:
        description: Retry tracking
        type: integer
      total_records:
        type: integer
      updated_at:
        type: string
    type: object
  domain.TranslationStatus:
    enum:
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - TranslationStatusPending
    - TranslationStatusApproved
    - TranslationStatusRejected
  domain.UITranslation:
    properties:
      created_at:
        type: string
      id:
        type: string
      language_code:
        type: string
      notes:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      status:
        $ref: '#/definitions/domain.TranslationStatus'
      submitted_by:
        type: string
      translation_key:
        type: string
      translation_value:
        type: string
      updated_at:
        type: string
    type: object
  domain.User:
    properties:
      approved_at:
        type: string
      approved_by:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_bootstrap:
        description: |-
          IsBootstrap marks the default seed admin that must be replaced on first login.
          Exposed in API responses so the UI can lock down actions on this account.
        type: boolean
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        $ref: '#/definitions/domain.UserStatus'
      updated_at:
        type: string
      username:
        type: string
    type: object
  domain.UserEntityLink:
    properties:
      children_scope:
        $ref: '#/definitions/domain.ChildrenScope'
      created_at:
        type: string
      entity_role:
        $ref: '#/definitions/domain.EntityRole'
      expires_at:
        type: string
      granted_at:
        type: string
      granted_by:
        type: string
      id:
        type: string
      lei:
        type: string
      notes:
        type: string
      revoked_at:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.UserRole:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
  domain.UserStatus:
    enum:
    - pending
    - active
    - inactive
    type: string
    x-enum-varnames:
    - UserStatusPending
    - UserStatusActive
    - UserStatusInactive
  handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.preferenceResponse:
    properties:
      page_key:
        type: string
      preference_key:
        type: string
      preference_value:
        type: string
    type: object
  handler.setPreferenceRequest:
    properties:
