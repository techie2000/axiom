  title: Axiom API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      description: Get list of all accounts
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Account'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create a new account
      parameters:
      - description: Account object
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/domain.Account'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Account'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - accounts
    get:
      consumes:
      - application/json
      description: Get a single account by ID
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Account'
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get account by ID
      tags:
      - accounts
    put:
      consumes:
      - application/json
      description: Update an existing account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Account object
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/domain.Account'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Account'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - accounts
  /admin/translations:
    get:
      description: Return a paginated list of translation strings, optionally filtered
        by language, status, or search text
      parameters:
      - description: Filter by ISO 639-1 language code (e.g. fr, es)
        in: query
        name: language
        type: string
      - description: Filter by status (pending, approved, rejected)
        in: query
        name: status
        type: string
      - description: Search by key or value substring
        in: query
        name: search
        type: string
      - description: Maximum records to return (default 50)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.translationListResponse'
      security:
      - BearerAuth: []
      summary: List UI translations for admin review
      tags:
      - translations
  /api/v1/lei:
    get:
      consumes:
      - application/json
      description: Get a paginated list of LEI records with optional search and filters
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search term (LEI code or legal name)
        in: query
        name: search
        type: string
      - description: Entity status filter (e.g., ACTIVE, INACTIVE)
        in: query
        name: status
        type: string
      - description: Entity category filter (e.g., GENERAL, FUND)
        in: query
        name: category
        type: string
      - description: Country code filter (e.g., US, GB)
        in: query
        name: country
        type: string
      - description: Sort field (lei, legal_name, entity_status, entity_category,
          legal_address_country, last_update_date)
        in: query
        name: sortBy
        type: string
      - default: asc
        description: Sort order (asc, desc)
        in: query
        name: sortOrder
        type: string
      - description: Include successor/managing LOU legal names in list response
        in: query
        name: includeLinkedNames
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LEIRecord'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List LEI records
      tags:
      - LEI
  /api/v1/lei-categories:
    get:
      description: Get sorted list of unique category values from LEI records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get distinct categories
      tags:
      - LEI
  /api/v1/lei-countries:
    get:
      description: Get sorted list of unique countries from LEI records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get distinct countries
      tags:
      - LEI
  /api/v1/lei-legal-forms:
    get:
      description: Get sorted list of unique legal form values from LEI records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get distinct legal forms
      tags:
      - LEI
  /api/v1/lei-regions:
    get:
      description: Get sorted list of unique regions from LEI records
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get distinct regions
      tags:
      - LEI
  /api/v1/lei/{lei}:
    get:
      consumes:
      - application/json
      description: Get a specific LEI record by its LEI code
      parameters:
      - description: LEI code
        in: path
        name: lei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LEIRecord'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get LEI record by code
      tags:
      - LEI
  /api/v1/lei/{lei}/audit:
    get:
      consumes:
      - application/json
      description: Get audit trail for a specific LEI record
      parameters:
      - description: LEI code
        in: path
        name: lei
        required: true
        type: string
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LEIRecordAudit'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get LEI audit history
      tags:
      - LEI
  /api/v1/lei/{lei}/predecessors:
    get:
      consumes:
      - application/json
      description: Get LEI records whose successor_lei equals the provided LEI
      parameters:
      - description: LEI code
        in: path
        name: lei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LEIRecord'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get predecessor LEI records
      tags:
      - LEI
  /api/v1/lei/count:
    get:
      description: Returns the total count of LEI records stored in the database,
        regardless of sync status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get total LEI record count
      tags:
      - LEI
  /api/v1/lei/import-failures:
    get:
      consumes:
      - application/json
      description: Get persisted Level 1/Level 2 processing failures with open/resolved
        lifecycle filtering
      parameters:
      - description: Job type filter (DAILY_FULL, DAILY_DELTA, LEVEL2_RR, LEVEL2_REPEX)
        in: query
        name: jobType
        type: string
      - default: true
        description: When true (default), returns only unresolved failures
        in: query
        name: openOnly
        type: boolean
      - default: 100
        description: Max rows
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List LEI import processing failures
      tags:
      - LEI
  /api/v1/lei/level2/failures:
    get:
      consumes:
      - application/json
      description: Deprecated endpoint. Use /api/v1/lei/import-failures instead.
      parameters:
      - description: Job type filter (DAILY_FULL, DAILY_DELTA, LEVEL2_RR, LEVEL2_REPEX)
        in: query
        name: jobType
        type: string
      - default: true
        description: When true (default), returns only unresolved failures
        in: query
        name: openOnly
        type: boolean
      - default: 100
        description: Max rows
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List LEI import processing failures (Deprecated)
      tags:
      - LEI
  /api/v1/lei/names:
    get:
      description: Returns a map of LEI code to legal name. Input codes are trimmed,
        normalized, deduplicated, and validated (20-char uppercase alphanumeric).
        Codes not found are absent from the response.
      parameters:
      - description: Comma-separated list of LEI codes (max 500)
        in: query
        name: codes
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Batch-fetch legal names for a set of LEI codes
      tags:
      - LEI
  /api/v1/lei/provisional:
    get:
      description: Returns provisional LEI records with pagination.
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List provisional LEI records
      tags:
      - Provisional LEI
    post:
      consumes:
      - application/json
      description: Issues a new provisional LEI record.
      parameters:
      - description: Create provisional LEI request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateProvisionalLEIRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.LEIRecord'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create provisional LEI record
      tags:
      - Provisional LEI
  /api/v1/lei/provisional/{lei}:
    get:
      description: Returns a single provisional LEI record by LEI code.
      parameters:
      - description: Provisional LEI code
        in: path
        name: lei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LEIRecord'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get provisional LEI record
      tags:
      - Provisional LEI
    put:
      consumes:
      - application/json
      description: Updates mutable fields of an existing provisional LEI record.
      parameters:
      - description: Provisional LEI code
        in: path
        name: lei
        required: true
        type: string
      - description: Update provisional LEI request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateProvisionalLEIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LEIRecord'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update provisional LEI record
      tags:
      - Provisional LEI
  /api/v1/lei/provisional/{lei}/succeed:
    post:
      consumes:
      - application/json
      description: Marks a provisional LEI as succeeded by a successor LEI.
      parameters:
      - description: Provisional LEI code
        in: path
        name: lei
        required: true
        type: string
      - description: Succeed provisional LEI request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.succeedProvisionalLEIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Succeed provisional LEI
      tags:
      - Provisional LEI
  /api/v1/lei/record/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific LEI record by its database ID
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LEIRecord'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get LEI record by ID
      tags:
      - LEI
  /api/v1/lei/source-file/{id}/resume:
    post:
      consumes:
      - application/json
      description: Resume processing of a source file from where it left off
      parameters:
      - description: Source file ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resume file processing
      tags:
      - LEI
  /api/v1/lei/status/{jobType}:
    get:
      consumes:
      - application/json
      description: Get the current processing status for LEI sync jobs
      parameters:
      - description: Job type (DAILY_FULL, DAILY_DELTA, LEVEL2_RR, or LEVEL2_REPEX)
        in: path
        name: jobType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.FileProcessingStatus'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get processing status
      tags:
      - LEI
  /api/v1/lei/sync/delta:
    post:
      consumes:
      - application/json
      description: Manually trigger a delta LEI data synchronization
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger delta LEI sync
      tags:
      - LEI
  /api/v1/lei/sync/full:
    post:
      consumes:
      - application/json
      description: Manually trigger a full LEI data synchronization
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger full LEI sync
      tags:
      - LEI
  /api/v1/lei/sync/gleif-reference:
    post:
      consumes:
      - application/json
      description: Manually trigger synchronization of GLEIF reference code lists
        (registration authorities,
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger GLEIF reference sync
      tags:
      - LEI
  /api/v1/lei/sync/level2:
    post:
      consumes:
      - application/json
      description: Manually trigger a GLEIF Level 2 data synchronization (Relationship
        Records + Reporting Exceptions). Runs independently of the
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger Level 2 LEI sync
      tags:
      - LEI
  /api/v1/lei/sync/level2/repex:
    post:
      consumes:
      - application/json
      description: Manually trigger the Level 2 Reporting Exceptions job.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger Level 2 Reporting Exceptions sync
      tags:
      - LEI
  /api/v1/lei/sync/level2/rr:
    post:
      consumes:
      - application/json
      description: Manually trigger the Level 2 Relationship Records job.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger Level 2 Relationship Records sync
      tags:
      - LEI
  /api/v1/lei/sync/masterdata:
    post:
      consumes:
      - application/json
      description: Manually trigger countries/currencies/languages synchronization
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger master data sync
      tags:
      - LEI
  /api/v1/user-entity-links:
    get:
      description: Returns active links by default; set include_revoked=true to include
        revoked links.
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Include revoked links
        in: query
        name: include_revoked
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
