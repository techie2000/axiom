      translation_key:
        type: string
      translation_value:
        type: string
    type: object
  handler.updateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  handler.userResponse:
    properties:
      approved_at:
        type: string
      approved_by:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_bootstrap:
        type: boolean
      role:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  service.CreateProvisionalLEIRequest:
    properties:
      child_lei:
        type: string
      legal_address_city:
        type: string
      legal_address_country:
        type: string
      legal_jurisdiction:
        type: string
      legal_name:
        type: string
      notes:
        type: string
      parent_lei:
        type: string
      provisioning_source:
        description: e.g. "onboarding", "counterparty"
        type: string
    required:
    - legal_name
    type: object
  service.GrantEntityLinkRequest:
    properties:
      children_scope:
        $ref: '#/definitions/domain.ChildrenScope'
      entity_role:
        $ref: '#/definitions/domain.EntityRole'
      expires_at:
        type: string
      lei:
        type: string
      notes:
        type: string
