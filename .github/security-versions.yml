update_schedule:
  # Automated update schedule
  security_scan:
    workflow: ".github/workflows/security-scan-enhanced.yml"
    schedule: "Weekly on Mondays at 9 AM UTC (cron: '0 9 * * 1')"
    manual_trigger: "workflow_dispatch"
    actions:
      - "Scan Docker images for vulnerabilities"
      - "Automatically update vulnerable packages"
      - "Create consolidated PR with all updates"
  
  dependabot:
    config: ".github/dependabot.yml"
    schedule: "Weekly on Mondays"
    actions:
      - "Monitor Docker base images"
      - "Monitor Go modules"
      - "Monitor npm packages"
      - "Create individual PRs for updates"

security_contacts:
  primary_reviewer: "techie2000"
  security_team: ["techie2000"]
  emergency_contact: "techie2000"

notes:
  version_pinning_philosophy: |
    We maintain explicit version pinning for all dependencies to ensure:
    1. Reproducible builds across all environments
    2. Controlled updates with proper testing
    3. Clear audit trail of security patches
    4. Prevention of unexpected breaking changes
  
  update_process: |
    1. Automated security scan runs weekly on Mondays at 9 AM UTC
    2. Trivy scans Docker images for vulnerabilities
    3. Workflow automatically updates versions in Dockerfiles and dependency files
    4. Consolidated PR created with all updates and CVE details
    5. Manual review and approval required before merge
    6. Dependabot creates separate PRs for base image updates
  
  manual_updates: |
    To manually trigger security scan:
    1. Go to Actions tab in GitHub
    2. Select "Security Scan Enhanced" workflow
    3. Click "Run workflow" button
    4. Select branch and click "Run workflow"
