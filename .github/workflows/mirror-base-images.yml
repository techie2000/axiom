name: Mirror Base Images

# Copies the public base images used by docker/Dockerfile.* into GHCR so CI
# builds are not subject to anonymous pull rate limits (Docker Hub / ECR Public).
# Consumers build with: --build-arg DOCKER_LIBRARY=ghcr.io/<owner>/mirror

on:
  schedule:
    - cron: '0 22 * * 6'  # Weekly on Saturday, ahead of the Sunday security scan
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-base-images.yml'

permissions:
  contents: read
  packages: write

env:
  # Google's anonymous cache of Docker Hub official images. public.ecr.aws rate limits
  # shared GitHub runner IPs ('Rate exceeded' / 'Data limit exceeded').
  SOURCE_LIBRARY: mirror.gcr.io/library

jobs:
  mirror:
    name: Mirror ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the FROM lines in docker/Dockerfile.* (see
        # .github/instructions/containerization-docker-best-practices.instructions.md)
        image:
          - alpine:3.21
          - golang:1.25.1-alpine3.21
          - node:22-alpine
          - node:22-alpine3.21
          - nginx:1.27-alpine
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy multi-arch image to GHCR
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          dest="ghcr.io/${OWNER,,}/mirror/${IMAGE}"
          for attempt in 1 2 3; do
            docker buildx imagetools create --tag "${dest}" "${SOURCE_LIBRARY}/${IMAGE}" && break
            if [ "${attempt}" = 3 ]; then exit 1; fi
            echo "Attempt ${attempt} failed, retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          docker buildx imagetools inspect "${dest}"
