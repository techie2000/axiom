name: Check PR Issue Link

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - edited
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Advise when PR has no linked issue and no override
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const actor = pr.user.login

            // Bots are always exempt
            if (actor.endsWith('[bot]') || actor === 'dependabot') {
              core.info('Bot PR — skipping issue link check')
              return
            }

            const prLabels = (pr.labels || []).map((l) => (typeof l === 'string' ? l : l.name))

            // Manual override via label (applied by maintainer or auto-label-prs workflow)
            if (prLabels.includes('no-issue-needed')) {
              core.info('no-issue-needed label present — skipping')
              return
            }

            const body = pr.body || ''

            // Issue-reference keywords: closes/fixes/resolves/refs/relates to + #N
            // Also support GitHub-accepted colon forms such as `Fixes: #123`.
            const hasIssueReferenceKeyword = /\b(closes?|fixes?|resolves?|refs?|relates?\s+to)(?:\s+|:\s*)#\d+/i.test(body)

            // Guardrail: closing keywords must target ISSUES, never PULL REQUESTS.
            // (Refs/Relates do not auto-close and are not blocked.)
            const closingKeywordMatches = [
              ...body.matchAll(/\b(closes?|fixes?|resolves?)(?:\s+|:\s*)#(\d+)\b/gi),
            ]
            const closingTargets = [...new Set(closingKeywordMatches.map((m) => Number(m[2])))]

            const closingTargetsThatArePRs = []
            for (const targetNumber of closingTargets) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetNumber,
                })

                if (issue?.data?.pull_request) {
                  closingTargetsThatArePRs.push(targetNumber)
                }
              } catch (error) {
                const details = error?.status ? `status ${error.status}` : String(error)
                core.setFailed(
                  `Unable to verify closing keyword target #${targetNumber} (${details}). ` +
                    'Do not use Closes/Fixes/Resolves until target verification succeeds.'
                )
                return
              }
            }

            if (closingTargetsThatArePRs.length > 0) {
              const list = closingTargetsThatArePRs.map((n) => `#${n}`).join(', ')
              core.setFailed(
                `Invalid closing keyword target: ${list} is a pull request. ` +
                  'Use `Refs #N` for PR references, or use `Closes/Fixes #N` only for issues.'
              )
              return
            }

            // GitHub-recognized closing references (may come from commits or timeline links)
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 50) {
                      totalCount
                    }
                  }
                }
              }
            `

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            })

            const linkedIssueCount =
              result?.repository?.pullRequest?.closingIssuesReferences?.totalCount || 0
            const hasLinkedClosingIssue = linkedIssueCount > 0

            // Template override checkbox checked
            const noIssueChecked = /- \[x\] no linked issue/i.test(body)

            if (hasIssueReferenceKeyword || hasLinkedClosingIssue || noIssueChecked) {
              core.info('Issue link or override found')
              return
            }

            // Avoid posting a duplicate advisory comment (handle pagination)
            const allComments = []
            let page = 1
            let hasMore = true
            while (hasMore) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                page: page,
                per_page: 50,
              })
              allComments.push(...comments)
              hasMore = comments.length === 50
              page++
            }

            const alreadyAdvised = allComments.some(
              (c) =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('<!-- pr-issue-link-advisory -->')
            )

            if (alreadyAdvised) {
              core.info('Advisory already posted')
              return
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '<!-- pr-issue-link-advisory -->',
                '> [!TIP]',
                '> This PR does not appear to reference a linked issue.',
                '> If one exists, add an issue reference in the PR description, for example:',
                '> `Refs #123` (preferred)',
                '> `Closes #123` (issue only; do not use for pull requests)',
                '>',
                '> If this PR does not need a backing issue (hotfix, chore, Dependabot),',
                '> check the **No linked issue** box in the PR description and add a brief reason.',
              ].join('\n'),
            })

            core.info(`Advisory comment posted on PR #${pr.number}`)
