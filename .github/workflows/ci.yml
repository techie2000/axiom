name: CI

on:
  push:
    branches:
      - main
      - dev
      - uat
      - prod
  pull_request:
    branches:
      - main
      - dev
      - uat
      - prod

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-environment:
    name: Detect Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Resolve target branch and environment
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${GITHUB_REF#refs/heads/}"
          fi
          case "$TARGET" in
            dev)  ENV="dev"  ;;
            uat)  ENV="uat"  ;;
            prod) ENV="prod" ;;
            *)    ENV="none" ;;
          esac
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Branch '$TARGET' maps to environment: $ENV"

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=10m

  lint-docker:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint < ./docker/Dockerfile.backend
          docker run --rm -i hadolint/hadolint < ./docker/Dockerfile.frontend

  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Build
        run: go build ./...
        working-directory: ./backend

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Run tests
        run: go test ./... -v -count=1
        working-directory: ./backend

  ci-summary:
    name: CI Summary (${{ needs.detect-environment.outputs.environment || 'none' }})
    runs-on: ubuntu-latest
    needs: [detect-environment, lint-go, lint-docker, build-go, test-go]
    if: always()
    steps:
      - name: Report CI result
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          LINT_GO="${{ needs.lint-go.result }}"
          LINT_DOCKER="${{ needs.lint-docker.result }}"
          BUILD="${{ needs.build-go.result }}"
          TEST="${{ needs.test-go.result }}"

          echo "Environment : $ENV"
          echo "Go Lint     : $LINT_GO"
          echo "Docker Lint : $LINT_DOCKER"
          echo "Build       : $BUILD"
          echo "Tests       : $TEST"

          if [ "$LINT_GO" != "success" ] || \
             [ "$LINT_DOCKER" != "success" ] || \
             [ "$BUILD" != "success" ] || \
             [ "$TEST" != "success" ]; then
            echo "❌ CI failed — see individual job logs above."
            exit 1
          fi

          if [ "$ENV" != "none" ]; then
            echo "✅ CI passed — ready to deploy to '$ENV' environment."
          else
            echo "✅ CI passed."
          fi
