name: Markdown Lint

on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-lint.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/vendor/**
            !**/.git/**
          config: '.markdownlint.yaml'
          fix: false

      - name: Markdown lint report
        if: failure()
        run: |
          echo "::error::Markdown linting failed. Run 'npx markdownlint-cli2 \"**/*.md\"' locally to see issues."
