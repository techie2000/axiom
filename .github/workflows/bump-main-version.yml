name: Bump Main Patch Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-main-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump patch version after main updates
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect manual version changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BEFORE_SHA='${{ github.event.before }}'
          HEAD_SHA='${{ github.sha }}'

          if [ "$BEFORE_SHA" = '0000000000000000000000000000000000000000' ]; then
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          fi

          printf 'Changed files in push:\n%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(VERSION|backend/internal/version/version.go)$'; then
            echo 'should_bump=false' >> "$GITHUB_OUTPUT"
            echo 'Push already contains an intentional version change. Skipping automatic patch bump.'
          else
            echo 'should_bump=true' >> "$GITHUB_OUTPUT"
            echo 'No version files changed in this push. Automatic patch bump will run.'
          fi

      - name: Set up PowerShell
        if: steps.detect.outputs.should_bump == 'true'
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Bump patch version
        if: steps.detect.outputs.should_bump == 'true'
        shell: pwsh
        run: ./scripts/bump-version.ps1 -Part patch

      - name: Commit and push version update
        if: steps.detect.outputs.should_bump == 'true'
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION=$(tr -d '\r\n' < VERSION)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add VERSION backend/internal/version/version.go
          git commit -m "chore: bump version to ${NEW_VERSION} [skip version bump]"
          git push