name: RA Lookup Weekly Check

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ra-lookups:
    name: Check External RA Lookups
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run weekly RA lookup smoke checks
        run: npm run check:ra-lookups
