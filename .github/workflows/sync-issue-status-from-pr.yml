name: Sync Issue Status From PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    steps:
      - name: Sync linked issue lifecycle labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR'])

            if (pr?.head?.repo?.fork || !trustedAssociations.has(pr?.author_association || '')) {
              core.info('Untrusted or fork PR source; skipping issue status label sync.')
              return
            }

            const statusLabels = [
              {
                name: 'status: triage',
                color: 'ededed',
                description: 'Needs initial review'
              },
              {
                name: 'status: in progress',
                color: 'fbca04',
                description: 'Actively being worked on'
              },
              {
                name: 'status: done',
                color: '0e8a16',
                description: 'Work completed or merged'
              }
            ]

            for (const labelDef of statusLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelDef.name
                })
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelDef.name,
                    color: labelDef.color,
                    description: labelDef.description
                  })
                } else {
                  throw error
                }
              }
            }

            const prNumber = pr.number
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    merged
                    state
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                        state
                        labels(first: 20) {
                          nodes {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: prNumber
            })

            const pullRequest = result.repository.pullRequest
            const linkedIssues = pullRequest.closingIssuesReferences.nodes || []

            if (linkedIssues.length === 0) {
              core.info('No linked issues found for this pull request.')
              return
            }

            const desiredStatus = pullRequest.merged
              ? 'status: done'
              : pullRequest.state === 'OPEN'
                ? 'status: in progress'
                : 'status: triage'

            const allStatusNames = statusLabels.map((label) => label.name)

            for (const issue of linkedIssues) {
              const currentStatusNames = (issue.labels.nodes || [])
                .map((label) => label.name)
                .filter((name) => allStatusNames.includes(name))

              for (const labelName of currentStatusNames) {
                if (labelName === desiredStatus) {
                  continue
                }

                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: labelName
                  })
                } catch (error) {
                  if (error.status !== 404) {
                    throw error
                  }
                }
              }

              if (!currentStatusNames.includes(desiredStatus)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: [desiredStatus]
                })
              }

              core.info(`Issue #${issue.number} set to ${desiredStatus}`)
            }