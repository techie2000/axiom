name: Auto Label Issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue labels from keywords
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const title = (issue.title || '').toLowerCase()
            const body = (issue.body || '').toLowerCase()
            const text = `${title}\n${body}`

            const labelRules = [
              {
                label: 'bug',
                color: 'd73a4a',
                description: 'Something is not working',
                patterns: [
                  /\bbug\b/,
                  /\berror\b/,
                  /\bfail(?:ed|ure)?\b/,
                  /\bbroken\b/,
                  /\bregression\b/
                ]
              },
              {
                label: 'enhancement',
                color: 'a2eeef',
                description: 'New feature or request',
                patterns: [
                  /\bfeature\b/,
                  /\benhancement\b/,
                  /\bimprovement\b/,
                  /\bproposal\b/,
                  /\brequest\b/
                ]
              },
              {
                label: 'documentation',
                color: '0075ca',
                description: 'Documentation related',
                patterns: [
                  /\bdoc(?:s|umentation)?\b/,
                  /\breadme\b/,
                  /\bguide\b/
                ]
              },
              {
                label: 'security',
                color: 'b60205',
                description: 'Security related',
                patterns: [
                  /\bsecurity\b/,
                  /\bvulnerab(?:ility|le)\b/,
                  /\bcve\b/,
                  /\bauth(?:entication|orization)?\b/
                ]
              },
              {
                label: 'performance',
                color: 'fbca04',
                description: 'Performance related',
                patterns: [
                  /\bperformance\b/,
                  /\bslow\b/,
                  /\blatency\b/,
                  /\bthroughput\b/,
                  /\bmemory\b/
                ]
              },
              {
                label: 'question',
                color: 'd876e3',
                description: 'Further information is requested',
                patterns: [
                  /\bquestion\b/,
                  /\bhow\b/,
                  /\bwhy\b/,
                  /\bhelp\b/
                ]
              }
            ]

            const labelsToApply = []
            for (const rule of labelRules) {
              if (rule.patterns.some((pattern) => pattern.test(text))) {
                labelsToApply.push(rule.label)
              }
            }

            if (labelsToApply.length === 0) {
              labelsToApply.push('triage')
            }

            const allLabels = [
              ...labelRules.map((r) => ({
                name: r.label,
                color: r.color,
                description: r.description
              })),
              {
                name: 'triage',
                color: 'ededed',
                description: 'Needs triage'
              }
            ]

            for (const labelDef of allLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelDef.name
                })
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelDef.name,
                    color: labelDef.color,
                    description: labelDef.description
                  })
                } else {
                  throw error
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...new Set(labelsToApply)]
            })

            core.info(`Applied labels: ${[...new Set(labelsToApply)].join(', ')}`)
