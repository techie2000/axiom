name: Auto Label Issues

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize issue title and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const title = (issue.title || '').toLowerCase()
            const body = (issue.body || '').toLowerCase()
            const text = `${title}\n${body}`
            const currentLabelNames = (issue.labels || []).map((label) =>
              typeof label === 'string' ? label : label.name
            )

            const statusLabels = [
              {
                name: 'status: triage',
                color: 'ededed',
                description: 'Needs initial review'
              },
              {
                name: 'status: in progress',
                color: 'fbca04',
                description: 'Actively being worked on'
              },
              {
                name: 'status: done',
                color: '0e8a16',
                description: 'Work completed or merged'
              }
            ]

            const labelRules = [
              {
                label: 'bug',
                color: 'd73a4a',
                description: 'Something is not working',
                patterns: [
                  /\bbug\b/,
                  /\berror\b/,
                  /\bfail(?:ed|ure)?\b/,
                  /\bbroken\b/,
                  /\bregression\b/
                ],
                negativePatterns: [
                  /\bno regression\b/,
                  /\bwithout regression\b/,
                  /\bavoid regression\b/,
                  /\bprevent regression\b/
                ]
              },
              {
                label: 'enhancement',
                color: 'a2eeef',
                description: 'New feature or request',
                patterns: [
                  /\bfeature\b/,
                  /\benhancement\b/,
                  /\bimprovement\b/,
                  /\bproposal\b/,
                  /\brequest\b/
                ]
              },
              {
                label: 'security',
                color: 'b60205',
                description: 'Security related',
                patterns: [
                  /\bsecurity\b/,
                  /\bvulnerab(?:ility|le)\b/,
                  /\bcve\b/,
                  /\bauth(?:entication|orization)?\b/
                ]
              },
              {
                label: 'performance',
                color: 'fbca04',
                description: 'Performance related',
                patterns: [
                  /\bperformance\b/,
                  /\bslow\b/,
                  /\blatency\b/,
                  /\bthroughput\b/,
                  /\bmemory\b/
                ]
              },
              {
                label: 'question',
                color: 'd876e3',
                description: 'Further information is requested',
                patterns: [
                  /\bquestion\b/,
                  /\?/
                ]
              }
            ]

            const actionIntentPatterns = [
              /\badd\b/,
              /\bimplement\b/,
              /\bcreate\b/,
              /\benable\b/,
              /\ballow\b/,
              /\bupdate\b/,
              /\brefactor\b/,
              /\bmigrate\b/,
              /\bremove\b/,
              /\bimprove\b/,
              /\bintroduce\b/,
              /\bsupport\b/
            ]

            const titlePrefixes = {
              bug: '[Bug]',
              enhancement: '[Feature]',
              security: '[Security]',
              performance: '[Performance]',
              question: '[Question]'
            }

            function extractCandidateTitleFromBody(rawBody) {
              if (!rawBody) {
                return ''
              }

              const lines = rawBody
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.length > 0)

              for (const line of lines) {
                if (line.startsWith('#')) {
                  continue
                }
                if (line.startsWith('- [ ]') || line.startsWith('- [x]')) {
                  continue
                }
                if (line.startsWith('- ')) {
                  continue
                }
                if (/^\d+\./.test(line)) {
                  continue
                }
                if (/^summary$/i.test(line) || /^description$/i.test(line) || /^objective$/i.test(line)) {
                  continue
                }
                if (/^parent:\s*#\d+/i.test(line) || /^child(?:ren)?:\s*#\d+/i.test(line)) {
                  continue
                }
                if (/^steps to reproduce$/i.test(line) || /^expected behavior$/i.test(line)) {
                  continue
                }
                if (/^actual behavior$/i.test(line) || /^problem to solve$/i.test(line)) {
                  continue
                }
                if (/^proposed solution$/i.test(line) || /^acceptance criteria$/i.test(line)) {
                  continue
                }
                if (/^environment$/i.test(line) || /^additional context$/i.test(line)) {
                  continue
                }
                if (/^\[.+\]$/.test(line)) {
                  continue
                }

                return line.replace(/[.\s]+$/, '')
              }

              return ''
            }

            function isWeakTitle(rawTitle) {
              const normalized = (rawTitle || '').trim().toLowerCase()
              if (normalized.length < 12) {
                return true
              }

              return [
                /^\[?(bug|feature|task|issue|problem|help|question|docs?)\]?[:\s-]*$/,
                /^(bug|feature request|task|issue|problem|help|question)[:\s-]/,
                /^(bug report|feature request|task)$/
              ].some((pattern) => pattern.test(normalized))
            }

            function toSentenceCase(value) {
              if (!value) {
                return ''
              }

              return value.charAt(0).toUpperCase() + value.slice(1)
            }

            const categoryLabelNames = labelRules.map((rule) => rule.label)
            const explicitCategoryLabels = currentLabelNames.filter((label) =>
              categoryLabelNames.includes(label)
            )
            const categoryPriority = ['bug', 'security', 'performance', 'enhancement', 'question']

            const inferredCategoryLabels = []
            for (const rule of labelRules) {
              let hasPositiveMatch = rule.patterns.some((pattern) => pattern.test(text))
              let hasNegativeMatch = (rule.negativePatterns || []).some((pattern) => pattern.test(text))

              if (rule.label === 'bug') {
                const hasDirectBugSignal = [
                  /\bbug\b/,
                  /\berror\b/,
                  /\bfail(?:ed|ure)?\b/,
                  /\bbroken\b/
                ].some((pattern) => pattern.test(text))
                const hasRegressionSignal = /\bregression\b/.test(text)
                const suppressRegressionSignal = (rule.negativePatterns || []).some((pattern) => pattern.test(text))

                // Keep bug inference from direct bug words, and only suppress the regression-specific signal.
                hasPositiveMatch = hasDirectBugSignal || (hasRegressionSignal && !suppressRegressionSignal)
                hasNegativeMatch = false
              }

              if (rule.label === 'question') {
                const hasQuestionMark = /\?/.test(issue.title || '') || /\n##\s*question\b/i.test(issue.body || '')
                const hasQuestionKeyword = /\bquestion\b/.test(text)
                const hasActionIntent = actionIntentPatterns.some((pattern) => pattern.test(text))

                // Avoid classifying feature/task requests as questions unless they explicitly look like Q&A.
                hasPositiveMatch = (hasQuestionMark || hasQuestionKeyword) && !hasActionIntent
                hasNegativeMatch = false
              }

              if (hasPositiveMatch && !hasNegativeMatch) {
                inferredCategoryLabels.push(rule.label)
              }
            }

            const labelsToApply = explicitCategoryLabels.length > 0
              ? [...explicitCategoryLabels]
              : inferredCategoryLabels

            labelsToApply.sort((a, b) => {
              const aRank = categoryPriority.indexOf(a)
              const bRank = categoryPriority.indexOf(b)
              return (aRank === -1 ? Number.MAX_SAFE_INTEGER : aRank) - (bRank === -1 ? Number.MAX_SAFE_INTEGER : bRank)
            })

            const primaryLabel = labelsToApply[0]
            const currentTitle = (issue.title || '').trim()
            const existingPrefixMatch = currentTitle.match(/^\[[^\]]+\]\s*/)
            const existingPrefix = existingPrefixMatch ? existingPrefixMatch[0].trim() : ''
            const desiredPrefix = primaryLabel ? (titlePrefixes[primaryLabel] || '[Task]') : ''
            const effectivePrefix = desiredPrefix || existingPrefix
            const explicitTypedPrefixMatch = currentTitle.match(/^\[(bug|feature|task|docs|security|performance|question)\]\s+/i)
            const hasExplicitTypedPrefix = Boolean(explicitTypedPrefixMatch)
            const existingTypedPrefix = explicitTypedPrefixMatch ? explicitTypedPrefixMatch[1].toLowerCase() : ''
            const typedPrefixCategoryMap = {
              bug: 'bug',
              feature: 'enhancement',
              security: 'security',
              performance: 'performance',
              question: 'question'
            }
            const existingTypedCategory = typedPrefixCategoryMap[existingTypedPrefix] || ''
            const hasStaleDocsPrefix = existingTypedPrefix === 'docs' && Boolean(desiredPrefix)
            const hasStaleTypedCategoryPrefix = hasStaleDocsPrefix || (Boolean(existingTypedCategory) && !labelsToApply.includes(existingTypedCategory) && Boolean(desiredPrefix))
            const bodyCandidate = extractCandidateTitleFromBody(issue.body || '')
            const rawStrippedTitle = currentTitle.replace(/^\[[^\]]+\]\s*/, '').trim()
            const baseTitle = isWeakTitle(currentTitle)
              ? (bodyCandidate || rawStrippedTitle)
              : rawStrippedTitle
            const normalizedBaseTitle = toSentenceCase(baseTitle)
            const needsRewrite = isWeakTitle(currentTitle)
            const needsPrefix = !existingPrefix && normalizedBaseTitle.length > 0
            const allowPrefixOverride = !hasExplicitTypedPrefix || needsRewrite || hasStaleTypedCategoryPrefix
            const shouldAdjustPrefix = desiredPrefix && existingPrefix !== desiredPrefix && allowPrefixOverride

            if ((needsRewrite || (needsPrefix && allowPrefixOverride) || shouldAdjustPrefix) && normalizedBaseTitle) {
              const nextTitle = `${effectivePrefix} ${normalizedBaseTitle}`.trim()
              if (nextTitle !== issue.title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  title: nextTitle
                })
                core.info(`Normalized issue title to: ${nextTitle}`)
              }
            }

            const areaLabelDefs = [
              { name: 'area:backend',      color: '2C5F8D', description: 'Backend Go services and API' },
              { name: 'area:frontend',     color: '17A2B8', description: 'Frontend Next.js / React' },
              { name: 'area:database',     color: '6f42c1', description: 'Database migrations and schema' },
              { name: 'area:docs',         color: '0075ca', description: 'Documentation and guides' },
              { name: 'area:infra',        color: '555555', description: 'Infrastructure and deployment' },
              { name: 'area:ci',           color: 'e4e669', description: 'CI/CD pipelines and workflows' },
              { name: 'area:lei',          color: 'D9534F', description: 'LEI data pipeline and GLEIF' },
              { name: 'area:dependencies', color: '0366d6', description: 'Dependency updates' },
            ]

            const typeLabelDefs = [
              { name: 'type:tests',    color: '28A745', description: 'Test coverage addition or fix' },
              { name: 'type:refactor', color: 'f9d0c4', description: 'Code quality, no behavior change' },
              { name: 'type:chore',    color: 'fef2c0', description: 'Maintenance, tooling, config' },
            ]

            const areaKeywordRules = [
              { label: 'area:lei',          patterns: [/\blei\b/, /\bgleif\b/, /\blevel[- ]?2\b/, /\brelationship record\b/, /\breporting exception\b/] },
              { label: 'area:ci',           patterns: [/\bgithub actions\b/, /\bworkflow\b/, /\bci\/cd\b/] },
              { label: 'area:database',     patterns: [/\b(?:db|database|sql|schema|postgres(?:ql)?)\s+migrations?\b/, /\bmigrations?\s+table\b/, /\bpostgres\b/, /\bschema\b/] },
              { label: 'area:infra',        patterns: [/\bdocker\b/, /\bcontainer\b/, /\bcompose\b/, /\bnginx\b/] },
              { label: 'area:frontend',     patterns: [/\breact\b/, /\bnext\.?js\b/, /\btailwind\b/, /\bi18n\b/] },
              { label: 'area:backend',      patterns: [/\bgolang\b/, /\bgo service\b/, /\bgorm\b/] },
              { label: 'area:dependencies', patterns: [/\bdependabot\b/, /\bdependency\b/, /\bgo\.mod\b/, /\bpackage\.json\b/] },
              { label: 'area:docs',         patterns: [/\badr\b/, /\barchitecture decision\b/] },
            ]

            const typeKeywordRules = [
              { label: 'type:tests',    patterns: [/\btest(?:s|ing)?\b/, /\bcoverage\b/] },
              { label: 'type:refactor', patterns: [/\brefactor\b/, /\bclean[- ]?up\b/] },
              { label: 'type:chore',    patterns: [/\bchore\b/, /\bmaintenance\b/, /\btooling\b/] },
            ]

            // Infer only the FIRST matching area label (enforce single primary area per issue)
            const areaMatch = areaKeywordRules.find((r) => r.patterns.some((p) => p.test(text)))
            const inferredAreaLabels = currentLabelNames.some((n) => n.startsWith('area:'))
              ? []
              : areaMatch
              ? [areaMatch.label]
              : []

            const inferredTypeLabels = currentLabelNames.some((n) => n.startsWith('type:'))
              ? []
              : typeKeywordRules.filter((r) => r.patterns.some((p) => p.test(text))).map((r) => r.label)

            const allLabels = [
              ...labelRules.map((r) => ({
                name: r.label,
                color: r.color,
                description: r.description
              })),
              ...areaLabelDefs,
              ...typeLabelDefs,
              ...statusLabels
            ]

            for (const labelDef of allLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelDef.name
                })
              } catch (error) {
                if (error.status === 404) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: labelDef.name,
                      color: labelDef.color,
                      description: labelDef.description
                    })
                  } catch (createError) {
                    if (createError.status !== 422) {
                      throw createError
                    }
                  }
                } else {
                  throw error
                }
              }
            }

            const existingNames = (issue.labels || []).map((label) =>
              typeof label === 'string' ? label : label.name
            )

            // Preserve 'status: in progress' if already set (linked PR open); otherwise apply based on issue state
            const existingStatus = existingNames.find((n) => n.startsWith('status:'))
            const statusToApply = existingStatus === 'status: in progress'
              ? 'status: in progress'
              : issue.state === 'open'
              ? 'status: triage'
              : 'status: done'
            const statusNames = statusLabels.map((label) => label.name)
            const labelsToRemove = existingNames.filter((label) =>
              statusNames.includes(label) && label !== statusToApply
            )

            if (labelsToRemove.length > 0) {
              for (const label of labelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: label
                  })
                } catch (error) {
                  if (error.status !== 404) {
                    throw error
                  }
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...new Set([...labelsToApply, ...inferredAreaLabels, ...inferredTypeLabels, statusToApply])]
            })

            core.info(`Applied labels: ${[...new Set([...labelsToApply, ...inferredAreaLabels, ...inferredTypeLabels, statusToApply])].join(', ')}`)
