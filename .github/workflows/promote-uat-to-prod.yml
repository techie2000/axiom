name: Monthly Promote uat → prod

on:
  schedule:
    - cron: '0 1 1 * *'  # 01:00 UTC on the 1st of every month — conservative cadence for production
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check only, do not create PR)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  promote:
    name: Create promotion PR (uat → prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if promotion is needed
        id: check
        run: |
          git fetch origin uat prod
          AHEAD=$(git rev-list --count origin/prod..origin/uat)
          echo "commits_ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  uat is $AHEAD commit(s) ahead of prod — promotion needed."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ prod is already up to date with uat — no promotion needed."
          fi

      - name: Check for existing open promotion PR
        id: existing
        if: steps.check.outputs.needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:uat`,
              base: 'prod',
            });
            if (prs.length > 0) {
              console.log(`ℹ️  Existing promotion PR found: #${prs[0].number} — skipping creation.`);
              return 'true';
            }
            return 'false';

      - name: Create promotion PR
        if: |
          steps.check.outputs.needed == 'true' &&
          steps.existing.outputs.result == '"false"' &&
          inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ahead = parseInt('${{ steps.check.outputs.commits_ahead }}', 10);
            const today = new Date().toISOString().split('T')[0];
            const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

            const body = [
              '## Automated promotion: `uat` → `prod`',
              '',
              `This PR was created automatically by the`,
              `[monthly promotion workflow](.github/workflows/promote-uat-to-prod.yml).`,
              '',
              `There ${ahead === 1 ? 'is' : 'are'} **${plural(ahead, 'commit')}** on \`uat\`` +
              ` that have not yet been promoted to \`prod\`.`,
              '',
              '### ⚠️ Production deployment — review carefully',
              '',
              '- Review the **full diff** and confirm every change has been validated in UAT.',
              '- Ensure all CI checks pass on this PR.',
              '- Obtain **at least two reviews** before merging (recommended for production).',
              '- Coordinate with the team before merging — production deployments should be',
              '  planned and communicated in advance.',
              '- Tag the merge commit with a version number per the',
              '  [version management instructions](internal/version/version.go).',
              '- To skip this promotion cycle, close this PR.',
              '',
              '---',
              '*Automatically generated — do not modify the branch directly.*',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: monthly promotion uat → prod (${today})`,
              head: 'uat',
              base: 'prod',
              body,
            });
            console.log(`✅ Created promotion PR #${pr.number}: ${pr.html_url}`);

      - name: Dry run summary
        if: inputs.dry_run == 'true'
        run: |
          AHEAD="${{ steps.check.outputs.commits_ahead }}"
          echo "🔍 Dry run — no PR created."
          echo "   uat is $AHEAD commit(s) ahead of prod."
