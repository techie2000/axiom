name: Lint

on:
  push:
    branches:
      - main
      - dev
      - uat
      - prod
  pull_request:
    branches:
      - main
      - dev
      - uat
      - prod

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci-lint:
    name: Go Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: 'backend/go.sum'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=10m --verbose

  docker-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint Dockerfiles
        run: |
          set -euo pipefail

          HADOLINT_IMAGE="hadolint/hadolint:v2.12.0"

          for attempt in 1 2 3; do
            if docker pull "$HADOLINT_IMAGE"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to pull $HADOLINT_IMAGE after 3 attempts"
              exit 1
            fi

            sleep $((attempt * 5))
          done

          for dockerfile in ./docker/Dockerfile.backend ./docker/Dockerfile.frontend; do
            for attempt in 1 2 3; do
              if docker run --rm -i "$HADOLINT_IMAGE" < "$dockerfile"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Hadolint failed for $dockerfile after 3 attempts"
                exit 1
              fi

              sleep $((attempt * 5))
            done
          done
