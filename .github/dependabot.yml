# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Docker base images in /docker directory
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "techie2000"
    assignees:
      - "techie2000"
    labels:
      - "dependencies"
      - "docker"
      - "security"
      - "area:dependencies"
      - "no-issue-needed"
    commit-message:
      prefix: "build(docker)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"

  # Go modules in /backend directory
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "techie2000"
    assignees:
      - "techie2000"
    labels:
      - "dependencies"
      - "go"
      - "backend"
      - "area:dependencies"
      - "no-issue-needed"
    commit-message:
      prefix: "build(go)"
      include: "scope"
    # Group Go module updates by type
    groups:
      go-framework:
        patterns:
          - "github.com/gin-gonic/*"
          - "gorm.io/*"
      go-stdlib:
        patterns:
          - "golang.org/x/*"
          - "github.com/golang/*"
    pull-request-branch-name:
      separator: "/"

  # npm packages in /frontend directory
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "techie2000"
    assignees:
      - "techie2000"
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
      - "area:dependencies"
      - "no-issue-needed"
    commit-message:
      prefix: "build(npm)"
      include: "scope"
    # Group npm updates by type
    groups:
      npm-framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      npm-dev:
        patterns:
          - "@types/*"
          - "typescript"
        dependency-type: "development"
    pull-request-branch-name:
      separator: "/"

# Security advisories
# Dependabot will automatically create PRs for security vulnerabilities
# found in dependencies, regardless of the schedule above.
