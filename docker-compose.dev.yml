services:
  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Dev Postgres now stores data in a bind mount so that database files are visible on the host:
      #   ./data/dev/postgres -> /var/lib/postgresql/data
      #
      # If you previously used the legacy named volume `postgres_data_dev`, you can perform a one-time
      # migration of your local dev data into this bind mount with:
      #
      #   docker run --rm \
      #     -v postgres_data_dev:/from \
      #     -v "$(pwd)/data/dev/postgres":/to \
      #     alpine sh -c 'cd /from && cp -a . /to'
      #
      # After migrating, you can safely remove the old volume with:
      #   docker volume rm postgres_data_dev
      # Bind mount replaces the former named volume `postgres_data_dev`.
      # ⚠️  MIGRATION: if you have existing data in the old named volume, copy it before starting:
      #   docker run --rm \
      #     -v postgres_data_dev:/source:ro \
      #     -v "$(pwd)/data/dev/postgres":/target \
      #     alpine sh -c "cp -a /source/. /target/"
      # See docs/environments/postgres-bind-mount-migration.md for full details and rollback steps.
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axiom-dev

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
      - rabbitmq_log_dev:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - axiom-dev

  backend:
    build:
      context: ./backend
      # Dev image with migration startup script and corporate TLS workarounds
      dockerfile: ../docker/Dockerfile.backend
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_MODE: ${SERVER_MODE}
      LOG_FILE_PATH: ${LOG_FILE_PATH}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS}
      LOG_COMPRESS: ${LOG_COMPRESS}
      LEI_DATADIR: ${LEI_DATADIR}
      LEI_KEEPFULLFILES: ${LEI_KEEPFULLFILES}
      LEI_KEEPDELTAFILES: ${LEI_KEEPDELTAFILES}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:13000,http://localhost:23000,http://localhost:33000,http://localhost:43000"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Origin,Content-Type,Authorization,Accept"
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./data/dev/lei:/root/data/lei  # Bind mount for developer access (dev environment)
      - ./log/dev:/root/log             # Persist logs for debugging (dev environment)
      - ./backend/config.yaml:/root/config/config.yaml:ro  # Mount config file with CORS settings
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - axiom-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Prevent node_modules and .next from being overwritten
      - frontend_node_modules_dev:/app/node_modules
      - frontend_next_dev:/app/.next
    command: npm run dev
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - axiom-dev

  docs-user:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs-user
    container_name: ${COMPOSE_PROJECT_NAME}-docs-user
    ports:
      - "${DOCS_USER_PORT}:80"
    profiles:
      - docs
    restart: unless-stopped
    networks:
      - axiom-dev

volumes:
  rabbitmq_data_dev:
  rabbitmq_log_dev:
  frontend_node_modules_dev:
  frontend_next_dev:
  # lei_data_dev removed - using bind mount at ./data/dev/lei for developer access

networks:
  axiom-dev:
    name: ${COMPOSE_PROJECT_NAME}-network
